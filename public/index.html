<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHERIX | Secure Digital Vault</title>
    <!-- SDK oficial de PayPal en Modo Live con tu Client ID de Producción -->
    <script src="https://www.paypal.com/sdk/js?client-id=BAA04kgu3t2iSl40-Bep9eKGE4F9YpGLDnqnz-Tk7yqoRJpBvJrYDBx21PbquHbDDbziC-7_zA14rbhVz0&currency=USD"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-bright: #f0f6fc;
            --accent-color: #58a6ff;
            --accent-hover: #1f6feb;
            --danger-color: #f85149;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--text-bright);
            letter-spacing: 1px;
        }

        .search-container {
            flex: 1;
            max-width: 500px;
            margin: 0 2rem;
        }

        .search-container input {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.5rem 1rem;
            color: var(--text-bright);
            font-size: 0.9rem;
            outline: none;
        }

        .search-container input:focus {
            border-color: var(--accent-color);
        }

        .cart-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-bright);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.2s;
        }

        .cart-btn:hover {
            background-color: var(--border-color);
        }

        .main-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
            width: 100%;
        }

        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }

        .hero h1 {
            color: var(--text-bright);
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: #8b949e;
        }

        .filters {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }

        .filter-btn {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--accent-hover);
            color: var(--text-bright);
            border-color: var(--accent-hover);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .product-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }

        .product-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background-color: #21262d;
        }

        .product-info {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-color);
            margin-bottom: 0.4rem;
            font-weight: bold;
        }

        .product-title {
            font-size: 1.1rem;
            color: var(--text-bright);
            margin-bottom: 0.5rem;
        }

        .product-desc {
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 1rem;
            flex: 1;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-bright);
        }

        .btn-primary {
            background-color: #238636;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background-color: #2ea043;
        }

        /* Modal del Carrito */
        .cart-modal {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            height: 100%;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            box-shadow: -5px 0 25px rgba(0,0,0,0.5);
            transition: right 0.3s ease;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        .cart-modal.open {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }

        .cart-header h2 {
            color: var(--text-bright);
            font-size: 1.2rem;
        }

        .close-cart {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-color);
            padding: 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .cart-item-info h4 {
            font-size: 0.9rem;
            color: var(--text-bright);
            margin-bottom: 0.2rem;
        }

        .cart-item-info span {
            font-size: 0.8rem;
            color: #8b949e;
        }

        .remove-item {
            background: var(--danger-color);
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            margin-top: 1rem;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-bright);
            margin-bottom: 1rem;
        }

        #paypal-button-container {
            margin-top: 1rem;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
        }

        .overlay.open {
            display: block;
        }

        /* Modal de Descarga / Éxito */
        .download-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            z-index: 1100;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
        }

        .download-modal.open {
            display: block;
            transform: translate(-50%, -50%) scale(1);
        }

        .download-modal h3 {
            color: var(--text-bright);
            margin-bottom: 1rem;
        }

        .download-modal p {
            color: #8b949e;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .download-link-btn {
            display: block;
            background-color: var(--accent-hover);
            color: white;
            text-decoration: none;
            padding: 0.75rem;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .download-link-btn:hover {
            background-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">AETHERIX</div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar programas, APK, emuladores...">
        </div>
        <button class="cart-btn" onclick="toggleCart()">
            🛒 Carrito (<span id="cartCount">0</span>)
        </button>
    </header>

    <div class="main-container">
        <div class="hero">
            <h1>Software Profesional Sin Esperas</h1>
            <p>Pasarela de pago encriptada. Archivos liberados automáticamente.</p>
        </div>

        <div class="filters">
            <button class="filter-btn active" onclick="filterProducts('all')">✨ Todos</button>
            <button class="filter-btn" onclick="filterProducts('Programas')">💻 Programas</button>
            <button class="filter-btn" onclick="filterProducts('Android APK')">📱 Android APK</button>
            <button class="filter-btn" onclick="filterProducts('Emuladores')">🎮 Emuladores</button>
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- Los productos se cargan dinámicamente -->
        </div>
    </div>

    <!-- Carrito Lateral -->
    <div class="overlay" id="overlay" onclick="toggleCart()"></div>
    <div class="cart-modal" id="cartModal">
        <div class="cart-header">
            <h2>Tu Carrito</h2>
            <button class="close-cart" onclick="toggleCart()">×</button>
        </div>
        <div class="cart-items" id="cartItemsContainer">
            <!-- Items del carrito -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <div id="paypal-button-container"></div>
        </div>
    </div>

    <!-- Modal de Descarga Tras Pago Exitoso -->
    <div class="download-modal" id="downloadModal">
        <h3>¡Pago Exitoso! 🎉</h3>
        <p>Gracias por tu compra. Tus archivos están listos para descargar:</p>
        <div id="downloadLinksContainer"></div>
        <button class="btn-primary" style="margin-top: 1rem; width: 100%;" onclick="closeDownloadModal()">Cerrar</button>
    </div>

    <script>
        let products = [];
        let cart = [];

        async function fetchProducts() {
            try {
                const res = await fetch('/api/products');
                products = await res.json();
                renderProducts(products);
            } catch (e) {
                console.error("Error al cargar productos", e);
            }
        }

        function renderProducts(items) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            if (!items || items.length === 0) {
                grid.innerHTML = '<p style="color: #8b949e; grid-column: 1/-1; text-align: center;">No se encontraron productos.</p>';
                return;
            }

            items.forEach(p => {
                // Compatible con la propiedad "image" de tu base de datos original (vault_files o imágenes directas)
                let imgSrc = p.image;
                if (!imgSrc || imgSrc === 'undefined' || imgSrc.trim() === '') {
                    imgSrc = 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300';
                } else if (!imgSrc.startsWith('http') && !imgSrc.startsWith('/')) {
                    imgSrc = '/' + imgSrc; 
                }

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${imgSrc}" class="product-img" alt="${p.title}">
                    <div class="product-info">
                        <span class="product-category">${p.tag || 'Digital'}</span>
                        <h3 class="product-title">${p.title}</h3>
                        <p class="product-desc">${p.desc || ''}</p>
                        <div class="product-footer">
                            <span class="product-price">$${parseFloat(p.price || 0).toFixed(2)} USD</span>
                            <button class="btn-primary" onclick="addToCart('${p.id}')">Agregar</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterProducts(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (category === 'all') {
                renderProducts(products);
            } else {
                const filtered = products.filter(p => p.tag && p.tag.toLowerCase() === category.toLowerCase());
                renderProducts(filtered);
            }
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = products.filter(p => p.title.toLowerCase().includes(term) || (p.desc && p.desc.toLowerCase().includes(term)));
            renderProducts(filtered);
        });

        function toggleCart() {
            document.getElementById('cartModal').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
            toggleCart();
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cartItemsContainer');
            const countElem = document.getElementById('cartCount');
            const totalElem = document.getElementById('cartTotal');

            container.innerHTML = '';
            let total = 0;
            let totalCount = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;
                totalCount += item.quantity;

                const div = document.createElement('div');
                div.className = 'cart-item';
                div.innerHTML = `
                    <div class="cart-item-info">
                        <h4>${item.title}</h4>
                        <span>${item.quantity} x $${parseFloat(item.price).toFixed(2)}</span>
                    </div>
                    <button class="remove-item" onclick="removeFromCart('${item.id}')">×</button>
                `;
                container.appendChild(div);
            });

            countElem.innerText = totalCount;
            totalElem.innerText = `$${total.toFixed(2)} USD`;
        }

        function closeDownloadModal() {
            document.getElementById('downloadModal').classList.remove('open');
            document.getElementById('overlay').classList.remove('open');
            cart = [];
            updateCartUI();
        }

        // Pasarela de PayPal para cobros reales con el total exacto del carrito
        paypal.Buttons({
            createOrder: function(data, actions) {
                let totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0).toFixed(2);
                if (parseFloat(totalAmount) <= 0) {
                    alert("El carrito está vacío");
                    return;
                }
                return actions.order.create({
                    purchase_units: [{
                        amount: {
                            value: totalAmount
                        }
                    }]
                });
            },
            onApprove: async function(data, actions) {
                return actions.order.capture().then(async function(details) {
                    const response = await fetch('/api/orders/capture', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ orderID: data.orderID, payer: details.payer })
                    });
                    const result = await response.json();
                    
                    toggleCart();
                    const linksContainer = document.getElementById('downloadLinksContainer');
                    linksContainer.innerHTML = '';
                    
                    let itemsToDownload = result.downloads || cart.map(p => ({ name: p.title, url: '#' }));
                    itemsToDownload.forEach(d => {
                        linksContainer.innerHTML += `<a href="${d.url}" class="download-link-btn" target="_blank">📥 Descargar: ${d.name}</a>`;
                    });
                    
                    document.getElementById('downloadModal').classList.add('open');
                    document.getElementById('overlay').classList.add('open');
                });
            }
        }).render('#paypal-button-container');

        fetchProducts();
    </script>
</body>
</html>
